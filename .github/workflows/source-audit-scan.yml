name: Source Audit Scan

on:
  push:
    branches:
      - main
      - codex/**
      - fix/**
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan source without modifying the repository
        id: scan
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-artifacts
          force_unwraps=$(grep -R -n --include='*.kt' '!!' app/src/main/java || true)
          stack_traces=$(grep -R -n --include='*.kt' -E 'printStackTrace\(|System\.out\.|println\(' app/src/main/java || true)
          unsafe_streams=$(grep -R -n --include='*.kt' -E 'openStream\(\).*readBytes|URL\([^)]*\)\.openStream' app/src/main/java || true)
          broad_provider_paths=$(grep -R -n --include='*.xml' -E '<files-path[^>]+path="users/' app/src/main/res || true)

          {
            echo "# Android source audit"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "## Force unwraps"
            if [ -n "$force_unwraps" ]; then echo "$force_unwraps"; else echo "None."; fi
            echo
            echo "## stdout and stack traces"
            if [ -n "$stack_traces" ]; then echo "$stack_traces"; else echo "None."; fi
            echo
            echo "## Unbounded URL streams"
            if [ -n "$unsafe_streams" ]; then echo "$unsafe_streams"; else echo "None."; fi
            echo
            echo "## Broad FileProvider paths"
            if [ -n "$broad_provider_paths" ]; then echo "$broad_provider_paths"; else echo "None."; fi
          } > audit-artifacts/SOURCE_AUDIT_SCAN.md

          if [ -n "$force_unwraps$stack_traces$unsafe_streams$broad_provider_paths" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-${{ github.sha }}
          path: audit-artifacts/SOURCE_AUDIT_SCAN.md
          if-no-files-found: error
          retention-days: 14

      - name: Enforce source-audit result
        if: steps.scan.outputs.status != 'passed'
        run: exit 1
