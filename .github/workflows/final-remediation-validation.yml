name: Full Android Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate source and Android build outputs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            test \
            lintDebug \
            lintRelease \
            assembleDebug \
            assembleRelease \
            assembleDebugAndroidTest \
            bundleRelease 2>&1 | tee full-validation.log
          git diff --check

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-android-validation-${{ github.sha }}
          path: |
            full-validation.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
