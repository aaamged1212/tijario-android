name: Android CI

on:
  push:
    branches:
      - main
      - codex/**
      - fix/**
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verify:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            compileDebugKotlin \
            testDebugUnitTest \
            assembleDebugAndroidTest 2>&1 | tee gradle-fast-verify.log
          git diff --check

      - name: Extract focused failure diagnostics
        if: failure()
        shell: bash
        run: |
          : > gradle-fast-verify-diagnostics.log
          if [[ -f gradle-fast-verify.log ]]; then
            grep -E -i -C 3 '(^e: |error:|FAILURE:|Execution failed for task|What went wrong|Caused by:)' gradle-fast-verify.log \
              | tail -n 300 \
              >> gradle-fast-verify-diagnostics.log || true
          fi

          shopt -s nullglob
          test_results=(app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if (( ${#test_results[@]} > 0 )); then
            {
              echo
              echo '===== Failing JVM tests ====='
              grep -H -E '<testsuite[^>]*failures="[1-9]|<failure|<error' "${test_results[@]}" || true
            } >> gradle-fast-verify-diagnostics.log
          fi

          if [[ ! -s gradle-fast-verify-diagnostics.log ]]; then
            tail -n 300 gradle-fast-verify.log > gradle-fast-verify-diagnostics.log || true
          fi
          cat gradle-fast-verify-diagnostics.log

      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-fast-verify-diagnostics
          path: |
            gradle-fast-verify-diagnostics.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7

  release-verify:
    name: Lint and release assembly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint and assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-parallel --stacktrace --console=plain \
            lintDebug \
            lintRelease 2>&1 | tee gradle-release-verify.log
          ./gradlew --no-daemon --no-parallel --stacktrace --console=plain \
            assembleDebug 2>&1 | tee -a gradle-release-verify.log
          ./gradlew --no-daemon --no-parallel --stacktrace --console=plain \
            assembleRelease 2>&1 | tee -a gradle-release-verify.log
          git diff --check

      - name: Extract focused failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f gradle-release-verify.log ]]; then
            grep -E -i -C 3 '(^e: |error:|FAILURE:|Execution failed for task|What went wrong|Caused by:)' gradle-release-verify.log \
              | tail -n 300 \
              > gradle-release-verify-diagnostics.log || true
          fi
          if [[ ! -s gradle-release-verify-diagnostics.log ]]; then
            tail -n 300 gradle-release-verify.log > gradle-release-verify-diagnostics.log || true
          fi
          cat gradle-release-verify-diagnostics.log

      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-verify-diagnostics
          path: gradle-release-verify-diagnostics.log
          if-no-files-found: error
          retention-days: 7
