name: Android CI

on:
  push:
    branches:
      - fix/full-audit-remediation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verify:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            compileDebugKotlin \
            testDebugUnitTest \
            assembleDebugAndroidTest 2>&1 | tee gradle-fast-verify.log

      - name: Print focused failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f gradle-fast-verify.log ]]; then
            grep -E -i -C 3 '(^e: |error:|FAILURE:|Execution failed for task|What went wrong|Caused by:)' gradle-fast-verify.log | tail -n 300 || true
          fi

  release-verify:
    name: Lint and release assembly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint and assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            lintDebug \
            assembleDebug \
            assembleRelease 2>&1 | tee gradle-release-verify.log

      - name: Print focused failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f gradle-release-verify.log ]]; then
            grep -E -i -C 3 '(^e: |error:|FAILURE:|Execution failed for task|What went wrong|Caused by:)' gradle-release-verify.log | tail -n 300 || true
          fi
