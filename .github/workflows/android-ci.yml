name: Android CI

on:
  push:
    branches:
      - fix/full-audit-remediation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verify:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and test
        run: >-
          ./gradlew --no-daemon --stacktrace
          compileDebugKotlin
          testDebugUnitTest
          assembleDebugAndroidTest

  release-verify:
    name: Lint and release assembly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint and assemble
        run: >-
          ./gradlew --no-daemon --stacktrace
          lintDebug
          assembleDebug
          assembleRelease
