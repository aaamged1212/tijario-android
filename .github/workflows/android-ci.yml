name: Android CI

on:
  push:
    branches:
      - fix/full-audit-remediation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form-image-remediation:
    name: Apply form image remediation
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/full-audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply compile repair and behavioral test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('app/src/main/java/app/tijario/ui/screens/FormScreens.kt')
          source = source_path.read_text()

          anchor = '''internal fun isDocumentIdentityEditable(isEditMode: Boolean): Boolean = !isEditMode
'''
          helper = '''internal fun isDocumentIdentityEditable(isEditMode: Boolean): Boolean = !isEditMode

internal fun shouldDeleteStoredProductImage(
    hasSelectedImage: Boolean,
    imageDeleted: Boolean,
): Boolean = !hasSelectedImage && imageDeleted
'''
          if 'internal fun shouldDeleteStoredProductImage(' not in source:
              if anchor not in source:
                  raise SystemExit('helper insertion anchor not found')
              source = source.replace(anchor, helper, 1)

          old = '''                                        selectedImageUri?.let { imageUri ->
                                            val dir = File(context.filesDir, "product_images")
                                            if (!dir.exists()) dir.mkdirs()
                                            val destFile = File(dir, "${product.id}.jpg")
                                            context.contentResolver.openInputStream(imageUri)?.use { input ->
                                                destFile.outputStream().use { output ->
                                                    input.copyTo(output)
                                                }
                                            }
                                        } ?: if (imageDeleted) {
                                            val destFile = File(context.filesDir, "product_images/${product.id}.jpg")
                                            if (destFile.exists()) {
                                                destFile.delete()
                                            }
                                        }
'''
          new = '''                                        val hasSelectedImage = selectedImageUri != null
                                        selectedImageUri?.let { imageUri ->
                                            val dir = File(context.filesDir, "product_images")
                                            if (!dir.exists()) dir.mkdirs()
                                            val destFile = File(dir, "${product.id}.jpg")
                                            context.contentResolver.openInputStream(imageUri)?.use { input ->
                                                destFile.outputStream().use { output ->
                                                    input.copyTo(output)
                                                }
                                            }
                                        }
                                        if (shouldDeleteStoredProductImage(hasSelectedImage, imageDeleted)) {
                                            val destFile = File(context.filesDir, "product_images/${product.id}.jpg")
                                            if (destFile.exists()) {
                                                destFile.delete()
                                            }
                                        }
'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('product image persistence block not found')
          source_path.write_text(source)

          test_path = Path('app/src/test/java/app/tijario/ui/screens/ProductImagePersistenceTest.kt')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''package app.tijario.ui.screens

import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class ProductImagePersistenceTest {
    @Test
    fun deletesStoredImageOnlyWhenNoReplacementWasSelected() {
        assertTrue(shouldDeleteStoredProductImage(hasSelectedImage = false, imageDeleted = true))
        assertFalse(shouldDeleteStoredProductImage(hasSelectedImage = true, imageDeleted = true))
        assertFalse(shouldDeleteStoredProductImage(hasSelectedImage = false, imageDeleted = false))
    }
}
''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/ui/screens/FormScreens.kt app/src/test/java/app/tijario/ui/screens/ProductImagePersistenceTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(forms): make product image persistence explicit"
            git push origin HEAD:fix/full-audit-remediation
          fi

  fast-verify:
    name: Compile and unit tests
    needs: form-image-remediation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            compileDebugKotlin \
            testDebugUnitTest \
            assembleDebugAndroidTest 2>&1 | tee gradle-fast-verify.log

      - name: Extract focused failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f gradle-fast-verify.log ]]; then
            grep -E -i -C 3 '(^e: |error:|FAILURE:|Execution failed for task|What went wrong|Caused by:)' gradle-fast-verify.log \
              | tail -n 300 \
              > gradle-fast-verify-diagnostics.log || true
          fi
          if [[ ! -s gradle-fast-verify-diagnostics.log ]]; then
            tail -n 300 gradle-fast-verify.log > gradle-fast-verify-diagnostics.log || true
          fi
          cat gradle-fast-verify-diagnostics.log

      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-fast-verify-diagnostics
          path: gradle-fast-verify-diagnostics.log
          if-no-files-found: error
          retention-days: 7

  release-verify:
    name: Lint and release assembly
    needs: form-image-remediation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint and assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain \
            lintDebug \
            assembleDebug \
            assembleRelease 2>&1 | tee gradle-release-verify.log

      - name: Extract focused failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f gradle-release-verify.log ]]; then
            grep -E -i -C 3 '(^e: |error:|FAILURE:|Execution failed for task|What went wrong|Caused by:)' gradle-release-verify.log \
              | tail -n 300 \
              > gradle-release-verify-diagnostics.log || true
          fi
          if [[ ! -s gradle-release-verify-diagnostics.log ]]; then
            tail -n 300 gradle-release-verify.log > gradle-release-verify-diagnostics.log || true
          fi
          cat gradle-release-verify-diagnostics.log

      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-verify-diagnostics
          path: gradle-release-verify-diagnostics.log
          if-no-files-found: error
          retention-days: 7
