name: Export Sync Remediation Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-sync-source.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation

      - name: Package source snapshot
        run: |
          mkdir -p /tmp/sync-source/app/src/main/java/app/tijario/data/repository
          mkdir -p /tmp/sync-source/app/src/main/java/app/tijario/data/remote
          mkdir -p /tmp/sync-source/app/src/main/java/app/tijario/data/model
          mkdir -p /tmp/sync-source/app/src/main/java/app/tijario/data/local
          mkdir -p /tmp/sync-source/app/src/main/java/app/tijario/config
          cp app/src/main/java/app/tijario/data/repository/TijarioRepository.kt /tmp/sync-source/app/src/main/java/app/tijario/data/repository/
          cp app/src/main/java/app/tijario/data/remote/BackendApiClient.kt /tmp/sync-source/app/src/main/java/app/tijario/data/remote/
          cp app/src/main/java/app/tijario/data/model/TijarioModels.kt /tmp/sync-source/app/src/main/java/app/tijario/data/model/
          cp app/src/main/java/app/tijario/data/local/TijarioEntities.kt /tmp/sync-source/app/src/main/java/app/tijario/data/local/
          cp app/src/main/java/app/tijario/config/AppPreferences.kt /tmp/sync-source/app/src/main/java/app/tijario/config/

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sync-remediation-source
          path: /tmp/sync-source
          if-no-files-found: error
          retention-days: 3
