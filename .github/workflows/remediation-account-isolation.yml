}"""
          dao = replace_once(dao, old_dao_end, new_dao_end, "DAO complete cache clearing")
          dao_path.write_text(dao, encoding="utf-8")

          # Bump Room and recreate unscoped legacy-only tables without assigning them to an arbitrary account.
          db = replace_once(db, "    version = 14,", "    version = 15,", "Room version 15")
          old_migration_tail = """        val MIGRATION_13_14 = object : Migration(13, 14) {
            override fun migrate(db: SupportSQLiteDatabase) {
                db.execSQL("ALTER TABLE local_document_metadata ADD COLUMN discount_type TEXT NOT NULL DEFAULT 'fixed'")
