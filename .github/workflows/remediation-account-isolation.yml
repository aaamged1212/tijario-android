name: Remediation Account Isolation

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-account-isolation.yml

permissions:
  contents: write

jobs:
  isolate-local-account-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply release blocker and account isolation repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if new in source:
                  return source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one old block, found {count}")
              return source.replace(old, new, 1)

          # Phase 1 idempotent repairs.
          db_path = Path("app/src/main/java/app/tijario/data/local/TijarioDatabase.kt")
          db = db_path.read_text(encoding="utf-8")
          db = replace_once(
              db,
              """                        lock_expires_at INTEGER,
                        last_error TEXT,""",
              """                        lock_expires_at INTEGER,
                        next_retry_at INTEGER NOT NULL DEFAULT 0,
                        last_error TEXT,""",
              "Room 6-7 next_retry_at",
          )

          repo_path = Path("app/src/main/java/app/tijario/data/repository/TijarioRepository.kt")
          repo = repo_path.read_text(encoding="utf-8")
          old_first = """            dao.upsertOutbox(entry)
            return
        }

        val first = pending.first()
        when {"""
          new_first = """            dao.upsertOutbox(entry)
        } else {
            val first = pending.first()
            when {"""
          if old_first in repo:
              repo = repo.replace(old_first, new_first, 1)
              old_tail = """            }
        }
        SyncScheduler(context).triggerSync(userId)
    }

    // Remote Cache Ingestion Policy"""
              new_tail = """            }
            }
        }
        SyncScheduler(context).triggerSync(userId)
    }

    // Remote Cache Ingestion Policy"""
              if old_tail not in repo:
                  raise SystemExit("Outbox compaction closing block not found")
              repo = repo.replace(old_tail, new_tail, 1)
          elif "        } else {\n            val first = pending.first()" not in repo:
              raise SystemExit("Outbox first-item repair block not found")

          # Scope local-only entities by user.
          entities_path = Path("app/src/main/java/app/tijario/data/local/TijarioEntities.kt")
          entities = entities_path.read_text(encoding="utf-8")
          replacements = [
              (
                  """@Entity(tableName = "local_taxes")
