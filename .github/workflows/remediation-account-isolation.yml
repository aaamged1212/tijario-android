                db.execSQL("CREATE TABLE IF NOT EXISTS local_taxes (user_id TEXT NOT NULL, id TEXT NOT NULL, name TEXT NOT NULL, rate REAL NOT NULL, PRIMARY KEY(user_id, id))")
