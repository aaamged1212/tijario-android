name: Apply Account Isolation

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/apply-account-isolation.yml

permissions:
  contents: write

concurrency:
  group: apply-account-isolation
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply deterministic remediation
        run: python3 scripts/remediation/account_isolation.py .

      - name: Verify source changes
        run: >-
          ./gradlew --no-daemon --stacktrace
          compileDebugKotlin
          testDebugUnitTest
          assembleDebugAndroidTest

      - name: Commit to remediation branch
        run: |
          if git diff --quiet; then
            echo "Account isolation is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/local/TijarioEntities.kt
          git add app/src/main/java/app/tijario/data/local/TijarioDao.kt
          git add app/src/main/java/app/tijario/data/local/TijarioDatabase.kt
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git add app/schemas
          git commit -m "fix(android): isolate local account data"
          git push origin HEAD:fix/full-audit-remediation
