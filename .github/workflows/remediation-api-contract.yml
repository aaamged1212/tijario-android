name: Remediation API Contract

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-api-contract.yml

permissions:
  contents: write

jobs:
  repair-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Patch API DTOs, fallback, and diagnostics
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/app/tijario/data/remote/BackendApiClient.kt")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str):
              global source
              if new in source:
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              """    private suspend inline fun <reified T> HttpResponse.decodeJsonResponseOrFallback(
        crossinline fallback: suspend () -> T,
    ): T {
        val contentType = headers[HttpHeaders.ContentType].orEmpty()
        val text = bodyAsText()
        val parsed = runCatching { apiJson.decodeFromString<T>(text) }.getOrNull()
        if (parsed != null) return parsed

        return if (contentType.contains("application/json", ignoreCase = true)) {
            throw IllegalStateException(
                "Unexpected API response content type. ${responseDiagnostic(contentType, text)}",
            )
        } else {
            fallback()
        }
    }""",
              """    private suspend inline fun <reified T> HttpResponse.decodeJsonResponseOrFallback(
        crossinline fallback: suspend () -> T,
    ): T {
        val contentType = headers[HttpHeaders.ContentType].orEmpty()
        val text = bodyAsText()
        val parsed = runCatching { apiJson.decodeFromString<T>(text) }.getOrNull()
        if (parsed != null) return parsed

        val compatibilityStatus = status.value in setOf(404, 405, 501)
        if (compatibilityStatus) return fallback()

        throw IllegalStateException(
            "Unexpected API response. status=${status.value}, ${responseDiagnostic(contentType, text)}",
        )
    }""",
              "AI fallback policy",
          )

          replace_once(
              """    private fun responseDiagnostic(contentType: String, body: String): String {
        val preview = body.trim()
            .replace(Regex("\\s+"), " ")
            .take(120)
        return "contentType=${contentType.ifBlank { "<empty>" }}, bodyPreview=${preview.ifBlank { "<empty>" }}"
    }""",
              """    private fun responseDiagnostic(contentType: String, body: String): String =
        "contentType=${contentType.ifBlank { "<empty>" }}, bodyLength=${body.length}"
""",
              "Response diagnostics redaction",
          )

          replace_once(
              """    val status: String,
    val payment_status: String?,
    val issue_date: String,""",
              """    val status: String,
    val payment_status: String?,
    val amount_paid: Double? = null,
    val issue_date: String,""",
              "Document amount_paid DTO",
          )

          replace_once(
              """data class DocumentItemServerDto(
    val id: String,
    val document_id: String,
    val name: String,""",
              """data class DocumentItemServerDto(
    val id: String,
    val document_id: String,
    val product_id: String? = null,
    val name: String,""",
              "Document item product_id DTO",
          )

          path.write_text(source, encoding="utf-8")

      - name: Verify API contract patch
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace compileDebugKotlin testDebugUnitTest > /tmp/api-contract.log 2>&1
          status=$?
          set -e
          cp /tmp/api-contract.log docs/ai/API_CONTRACT_RUN.log
          echo "verification_status=$status" >> docs/ai/API_CONTRACT_RUN.log
          echo "$status" > /tmp/api-contract-status

      - name: Commit patch and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/remote/BackendApiClient.kt || true
          git add docs/ai/API_CONTRACT_RUN.log || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(android): harden API sync and diagnostics"
          git pull --rebase origin fix/full-audit-remediation
          git push origin HEAD:fix/full-audit-remediation

      - name: Fail when verification failed
        if: always()
        run: |
          test "$(cat /tmp/api-contract-status)" = "0"
