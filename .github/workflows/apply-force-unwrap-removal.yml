name: Apply Force Unwrap Removal

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/apply-force-unwrap-removal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python3 scripts/remediation/remove_force_unwraps.py .

      - name: Commit to remediation branch
        run: |
          if git diff --quiet; then
            echo "Force unwraps are already removed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/ui/screens/FormScreens.kt
          git add app/src/main/java/app/tijario/ui/screens/DocumentDetailScreen.kt
          git add app/src/main/java/app/tijario/ui/screens/AuthScreens.kt
          git add app/src/main/java/app/tijario/ui/screens/SettingsScreens.kt
          git add app/src/main/java/app/tijario/ui/screens/CoreScreens.kt
          git commit -m "fix(android): remove unsafe force unwraps"
          git push origin HEAD:fix/full-audit-remediation
