name: Apply Final Hardening

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/apply-final-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-final-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python3 scripts/remediation/final_hardening.py .

      - name: Commit to remediation branch
        run: |
          if git diff --quiet; then
            echo "Final hardening is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/local/TijarioDao.kt
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git add app/src/main/java/app/tijario/analytics/TijarioAnalytics.kt
          git add app/src/main/java/app/tijario/data/remote/BackendApiClient.kt
          git commit -m "fix(android): complete account and analytics hardening"
          git push origin HEAD:fix/full-audit-remediation
