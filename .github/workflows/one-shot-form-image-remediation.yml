name: One-shot Form Image Remediation

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/one-shot-form-image-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply compile repair and behavioral test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('app/src/main/java/app/tijario/ui/screens/FormScreens.kt')
          source = source_path.read_text()

          anchor = '''internal fun isDocumentIdentityEditable(isEditMode: Boolean): Boolean = !isEditMode
'''
          helper = '''internal fun isDocumentIdentityEditable(isEditMode: Boolean): Boolean = !isEditMode

internal fun shouldDeleteStoredProductImage(
    hasSelectedImage: Boolean,
    imageDeleted: Boolean,
): Boolean = !hasSelectedImage && imageDeleted
'''
          if anchor not in source:
              raise SystemExit('helper insertion anchor not found')
          source = source.replace(anchor, helper, 1)

          old = '''                                        selectedImageUri?.let { imageUri ->
                                            val dir = File(context.filesDir, "product_images")
                                            if (!dir.exists()) dir.mkdirs()
                                            val destFile = File(dir, "${product.id}.jpg")
                                            context.contentResolver.openInputStream(imageUri)?.use { input ->
                                                destFile.outputStream().use { output ->
                                                    input.copyTo(output)
                                                }
                                            }
                                        } ?: if (imageDeleted) {
                                            val destFile = File(context.filesDir, "product_images/${product.id}.jpg")
                                            if (destFile.exists()) {
                                                destFile.delete()
                                            }
                                        }
'''
          new = '''                                        val hasSelectedImage = selectedImageUri != null
                                        selectedImageUri?.let { imageUri ->
                                            val dir = File(context.filesDir, "product_images")
                                            if (!dir.exists()) dir.mkdirs()
                                            val destFile = File(dir, "${product.id}.jpg")
                                            context.contentResolver.openInputStream(imageUri)?.use { input ->
                                                destFile.outputStream().use { output ->
                                                    input.copyTo(output)
                                                }
                                            }
                                        }
                                        if (shouldDeleteStoredProductImage(hasSelectedImage, imageDeleted)) {
                                            val destFile = File(context.filesDir, "product_images/${product.id}.jpg")
                                            if (destFile.exists()) {
                                                destFile.delete()
                                            }
                                        }
'''
          if old not in source:
              raise SystemExit('product image persistence block not found')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('app/src/test/java/app/tijario/ui/screens/ProductImagePersistenceTest.kt')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''package app.tijario.ui.screens

import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class ProductImagePersistenceTest {
    @Test
    fun deletesStoredImageOnlyWhenNoReplacementWasSelected() {
        assertTrue(shouldDeleteStoredProductImage(hasSelectedImage = false, imageDeleted = true))
        assertFalse(shouldDeleteStoredProductImage(hasSelectedImage = true, imageDeleted = true))
        assertFalse(shouldDeleteStoredProductImage(hasSelectedImage = false, imageDeleted = false))
    }
}
''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/ui/screens/FormScreens.kt app/src/test/java/app/tijario/ui/screens/ProductImagePersistenceTest.kt
          git commit -m "fix(forms): make product image persistence explicit"

      - name: Update remediation tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ai/AUDIT_REMEDIATION_STATUS.md')
          text = path.read_text()
          text = text.replace(
              '- Current source head: `a04ce2c78adcf0e6c3cdc89410b5d3d4c0cd585c`.',
              '- Current source head: product-image compile repair commit created by the one-shot remediation workflow; final SHA is recorded by Git history.'
          )
          text = text.replace(
              '- Run 158 for the bot-authored repair commit concluded `action_required` before jobs executed, so no clean compile/unit/lint/debug/release result is claimed yet.',
              '- Android CI run 162 executed on `7cb517888e3f7c4d71a0b9cc9d3835118e1adeea` and exposed two independent Kotlin expression errors in the product-image persistence block of `FormScreens.kt`. The block now uses explicit replacement/deletion control flow and has a behavioral unit test for deletion precedence. A clean compile/unit/lint/debug/release result is still pending.'
          )
          text = text.replace(
              '- [ ] Record clean baseline CI result. **IN PROGRESS:** run 155 produced actionable diagnostics; the first syntax failure is fixed and awaits an executable CI run.',
              '- [ ] Record clean baseline CI result. **IN PROGRESS:** run 162 exposed the next compiler failure in product-image persistence; the scoped repair and behavioral test are committed and await the next executable CI run.'
          )
          text = text.replace(
              '- [ ] Remove remediation-only workflows/scripts after final validation so the branch retains only permanent CI and product assets. **IN PROGRESS:** the one-shot syntax-repair workflow is being removed immediately after applying its scoped commit; remaining diagnostic assets stay until validation completes.',
              '- [ ] Remove remediation-only workflows/scripts after final validation so the branch retains only permanent CI and product assets. **IN PROGRESS:** one-shot repair workflows remove themselves after their scoped commits; permanent diagnostics remain until validation completes.'
          )
          path.write_text(text)
          PY
          git add docs/ai/AUDIT_REMEDIATION_STATUS.md
          git commit -m "docs(audit): record product image compile repair"

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-form-image-remediation.yml
          git commit -m "chore(ci): remove product image remediation workflow"

      - name: Push scoped commits
        shell: bash
        run: git push origin HEAD:fix/full-audit-remediation
