name: Apply App Runtime State

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/apply-app-runtime-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python3 scripts/remediation/move_activity_state.py .

      - name: Commit to remediation branch
        run: |
          if git diff --quiet; then
            echo "Activity state is already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/MainActivity.kt
          git add app/src/main/java/app/tijario/config/AppRuntimeState.kt
          git add app/src/main/java
          git commit -m "refactor(android): remove Activity companion state"
          git push origin HEAD:fix/full-audit-remediation
