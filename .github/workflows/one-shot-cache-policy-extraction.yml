name: One-shot cache policy call-site integration

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/one-shot-cache-policy-extraction.yml

permissions:
  contents: write

concurrency:
  group: one-shot-cache-policy-call-sites
  cancel-in-progress: false

jobs:
  integrate-policy:
    if: github.repository == 'aaamged1212/tijario-android' && github.ref == 'refs/heads/fix/full-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Delegate cache-ingestion call sites to policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/tijario/data/repository/TijarioRepository.kt')
          source = path.read_text()
          protected = 'listOf("LOCAL_ONLY", "PENDING_SYNC", "PENDING_DELETE", "CONFLICT")'
          blocking = f'existing != null && existing.syncStatus in {protected}'
          allowing = f'existing == null || existing.syncStatus !in {protected}'

          if source.count(blocking) != 3 or source.count(allowing) != 2:
              raise SystemExit(
                  f'Unexpected call-site counts: blocking={source.count(blocking)}, allowing={source.count(allowing)}'
              )

          source = source.replace(
              blocking,
              '!RemoteCacheReplacementPolicy.shouldReplace(existing?.syncStatus)',
          )
          source = source.replace(
              allowing,
              'RemoteCacheReplacementPolicy.shouldReplace(existing?.syncStatus)',
          )
          path.write_text(source)
          PY

      - name: Verify exact source delegation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/app/tijario/data/repository/TijarioRepository.kt').read_text()
          call = 'RemoteCacheReplacementPolicy.shouldReplace(existing?.syncStatus)'
          if source.count(call) != 5:
              raise SystemExit(f'Expected 5 policy calls, found {source.count(call)}')
          if 'existing.syncStatus in listOf("LOCAL_ONLY", "PENDING_SYNC", "PENDING_DELETE", "CONFLICT")' in source:
              raise SystemExit('Blocking inline status check remains')
          if 'existing.syncStatus !in listOf("LOCAL_ONLY", "PENDING_SYNC", "PENDING_DELETE", "CONFLICT")' in source:
              raise SystemExit('Allowing inline status check remains')
          PY

      - name: Run focused and full host validation
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            testDebugUnitTest --tests app.tijario.data.repository.RemoteCacheReplacementPolicyTest \
            compileDebugKotlin \
            testDebugUnitTest \
            assembleDebugAndroidTest \
            lintDebug \
            assembleDebug \
            assembleRelease

      - name: Commit policy integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git commit -m "refactor(sync): delegate cache replacement decisions"

      - name: Update remediation tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tracker = Path('docs/ai/AUDIT_REMEDIATION_STATUS.md')
          text = tracker.read_text()
          old = '- [ ] Split large screen/repository files incrementally while preserving behavior. **NEXT:** replace the five equivalent inline remote-cache status checks in `TijarioRepository` with `RemoteCacheReplacementPolicy.shouldPreserveLocal(...)`, then run the permanent read-only Android CI workflow.'
          new = '- [x] Split large screen/repository files incrementally while preserving behavior; the repeated remote-cache replacement decision is extracted into `RemoteCacheReplacementPolicy`, all five repository call sites delegate to it, and focused/full host validation passes.'
          if old not in text:
              raise SystemExit('Expected Phase 6 entry not found')
          text = text.replace(old, new)
          marker = '- Android CI run 222 completed successfully on `6ae7b5d9a9c193d88ed071f36b594ef6d3659d19`, confirming compile, JVM tests, AndroidTest assembly, lint, debug assembly, and unsigned release assembly remain clean after the policy/test extraction.\n'
          addition = marker + '- The five `TijarioRepository` cache-ingestion call sites now delegate to `RemoteCacheReplacementPolicy.shouldReplace`; focused policy tests and the full host Gradle verification completed before commit. Permanent Android CI remains the final independent check.\n'
          if marker not in text:
              raise SystemExit('Expected validation marker not found')
          text = text.replace(marker, addition, 1)
          text = text.replace('- The five inspected `TijarioRepository` cache-ingestion call sites still use equivalent inline status checks; Phase 6 remains open until those call sites delegate to the tested policy and the resulting source change passes CI.\n', '')
          tracker.write_text(text)
          PY
          git add docs/ai/AUDIT_REMEDIATION_STATUS.md
          git commit -m "docs(audit): record cache policy integration"

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-cache-policy-extraction.yml
          git commit -m "chore(ci): remove cache policy integration workflow"

      - name: Push scoped commits
        shell: bash
        run: git push origin HEAD:fix/full-audit-remediation
