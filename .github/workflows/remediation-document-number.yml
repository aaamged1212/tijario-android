name: Remediation Document Number

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-document-number.yml

permissions:
  contents: write

jobs:
  make-server-number-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Reconcile cached document number with server response
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/app/tijario/data/repository/TijarioRepository.kt")
          source = path.read_text(encoding="utf-8")
          needle = "documentNumber = request.documentNumber?.takeIf { it.isNotBlank() } ?: remote.documentNumber,"
          replacement = "documentNumber = resolveCachedDocumentNumber(remote.documentNumber, request.documentNumber),"

          occurrences = source.count(needle)
          if occurrences == 0 and source.count(replacement) == 2:
              print("Document-number reconciliation is already applied.")
          elif occurrences != 2:
              raise SystemExit(f"Expected two document-number cache overrides, found {occurrences}")
          else:
              path.write_text(source.replace(needle, replacement), encoding="utf-8")

      - name: Verify reconciliation tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          compileDebugKotlin
          testDebugUnitTest

      - name: Commit Android reconciliation fix
        run: |
          if git diff --quiet; then
            echo "Document-number fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git commit -m "fix(android): trust server allocated document numbers"
          git push origin HEAD:fix/full-audit-remediation
