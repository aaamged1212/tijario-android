name: One-shot cache policy call-site remediation

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/one-shot-cache-policy-callsite-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0
      - name: Replace inline protected-status checks
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/app/tijario/data/repository/TijarioRepository.kt')
          source = path.read_text()
          old = 'existing != null && existing.syncStatus in listOf("LOCAL_ONLY", "PENDING_SYNC", "PENDING_DELETE", "CONFLICT")'
          new = '!RemoteCacheReplacementPolicy.shouldReplace(existing?.syncStatus)'
          count = source.count(old)
          if count != 5:
              raise SystemExit(f'Expected exactly 5 inline checks, found {count}')
          path.write_text(source.replace(old, new))
      - name: Verify delegation and remove one-shot workflow
        shell: bash
        run: |
          test "$(grep -c 'RemoteCacheReplacementPolicy.shouldReplace(existing?.syncStatus)' app/src/main/java/app/tijario/data/repository/TijarioRepository.kt)" -eq 5
          test "$(grep -c 'existing != null && existing.syncStatus in listOf("LOCAL_ONLY", "PENDING_SYNC", "PENDING_DELETE", "CONFLICT")' app/src/main/java/app/tijario/data/repository/TijarioRepository.kt || true)" -eq 0
          rm .github/workflows/one-shot-cache-policy-callsite-remediation.yml
      - name: Commit scoped source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt .github/workflows/one-shot-cache-policy-callsite-remediation.yml
          git commit -m 'refactor(repository): delegate remote cache replacement policy'
          git push origin HEAD:fix/full-audit-remediation
