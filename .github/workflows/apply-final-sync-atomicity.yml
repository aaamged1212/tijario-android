name: Apply Final Sync Atomicity

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/apply-final-sync-atomicity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python3 scripts/remediation/final_sync_atomicity.py .

      - name: Commit to remediation branch
        run: |
          if git diff --quiet; then
            echo "Final sync atomicity fixes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git commit -m "fix(android): make document creation and sync atomic"
          git push origin HEAD:fix/full-audit-remediation
