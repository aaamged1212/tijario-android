name: Verify Remediation Fast

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/verify-remediation-fast.yml

permissions:
  contents: write

concurrency:
  group: verify-remediation-fast
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and test
        id: verify
        shell: bash
        run: |
          mkdir -p docs/ai
          set +e
          ./gradlew --no-daemon --stacktrace compileDebugKotlin testDebugUnitTest assembleDebugAndroidTest > docs/ai/FAST_VERIFICATION.log 2>&1
          status=$?
          set -e
          {
            echo "# Fast verification"
            echo
            echo "- Commit tested: $(git rev-parse HEAD)"
            echo "- Exit status: $status"
          } > docs/ai/FAST_VERIFICATION.md
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/FAST_VERIFICATION.md docs/ai/FAST_VERIFICATION.log
          git commit -m "test(android): record fast verification" || exit 0
          git push origin HEAD:fix/full-audit-remediation

      - name: Fail when verification failed
        if: steps.verify.outputs.status != '0'
        run: exit 1
