name: Apply MainActivity Facade Removal

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/apply-main-activity-facade-removal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python3 scripts/remediation/remove_main_activity_facade.py .

      - name: Commit to remediation branch
        run: |
          if git diff --quiet; then
            echo "MainActivity facade is already removed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "refactor(android): remove MainActivity global facade"
          git push origin HEAD:fix/full-audit-remediation
