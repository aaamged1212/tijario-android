name: Remediation Hotfix

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-hotfix.yml

permissions:
  contents: write

jobs:
  apply-repository-syntax-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Repair enqueueOutbox block boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/app/tijario/data/repository/TijarioRepository.kt")
          source = path.read_text(encoding="utf-8")
          before = """                dao.upsertOutbox(entry)\n            }\n        }\n        SyncScheduler(context).triggerSync(userId)\n    }\n\n    // Remote Cache Ingestion Policy\n"""
          after = """                dao.upsertOutbox(entry)\n            }\n        }\n        }\n        SyncScheduler(context).triggerSync(userId)\n    }\n\n    // Remote Cache Ingestion Policy\n"""
          if source.count(before) != 1:
              raise SystemExit("Expected enqueueOutbox boundary not found exactly once")
          path.write_text(source.replace(before, after, 1), encoding="utf-8")

      - name: Commit scoped repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git diff --cached --check
          git commit -m "fix(repository): close outbox compaction branch"
          git push origin HEAD:fix/full-audit-remediation
