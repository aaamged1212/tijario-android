name: Remediation Phase 1

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-phase1.yml

permissions:
  contents: write

jobs:
  repair-room-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Repair Room migration 6 to 7
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/app/tijario/data/local/TijarioDatabase.kt")
          source = path.read_text(encoding="utf-8")
          needle = """                        lock_expires_at INTEGER,
                        last_error TEXT,"""
          replacement = """                        lock_expires_at INTEGER,
                        next_retry_at INTEGER NOT NULL DEFAULT 0,
                        last_error TEXT,"""

          if source.count(needle) != 1:
              raise SystemExit("Expected exactly one sync_outbox migration block to repair")

          path.write_text(source.replace(needle, replacement), encoding="utf-8")

      - name: Compile migration tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          compileDebugKotlin
          assembleDebugAndroidTest

      - name: Commit migration repair
        run: |
          if git diff --quiet; then
            echo "Migration repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/local/TijarioDatabase.kt
          git commit -m "fix(android): repair Room migration 6 to 7"
          git push origin HEAD:fix/full-audit-remediation
