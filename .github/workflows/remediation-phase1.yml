name: Remediation Phase 1

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-phase1.yml

permissions:
  contents: write

jobs:
  repair-release-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Repair Room migration and first outbox scheduling
        shell: python
        run: |
          from pathlib import Path

          db_path = Path("app/src/main/java/app/tijario/data/local/TijarioDatabase.kt")
          db_source = db_path.read_text(encoding="utf-8")
          old_column_block = """                        lock_expires_at INTEGER,
                        last_error TEXT,"""
          new_column_block = """                        lock_expires_at INTEGER,
                        next_retry_at INTEGER NOT NULL DEFAULT 0,
                        last_error TEXT,"""
          if old_column_block in db_source:
              db_source = db_source.replace(old_column_block, new_column_block, 1)
          elif new_column_block not in db_source:
              raise SystemExit("Could not locate sync_outbox migration column block")
          db_path.write_text(db_source, encoding="utf-8")

          repo_path = Path("app/src/main/java/app/tijario/data/repository/TijarioRepository.kt")
          repo_source = repo_path.read_text(encoding="utf-8")
          old_first_entry = """            dao.upsertOutbox(entry)
            return
        }

        val first = pending.first()
        when {"""
          new_first_entry = """            dao.upsertOutbox(entry)
        } else {
            val first = pending.first()
            when {"""
          if old_first_entry in repo_source:
              repo_source = repo_source.replace(old_first_entry, new_first_entry, 1)
              old_tail = """            }
        }
        SyncScheduler(context).triggerSync(userId)
    }

    // Remote Cache Ingestion Policy"""
              new_tail = """            }
            }
        }
        SyncScheduler(context).triggerSync(userId)
    }

    // Remote Cache Ingestion Policy"""
              if old_tail not in repo_source:
                  raise SystemExit("Could not close outbox compaction else block")
              repo_source = repo_source.replace(old_tail, new_tail, 1)
          elif "        } else {\n            val first = pending.first()" not in repo_source:
              raise SystemExit("Could not locate first outbox scheduling defect")
          repo_path.write_text(repo_source, encoding="utf-8")

      - name: Verify phase one
        run: >-
          ./gradlew --no-daemon --stacktrace
          compileDebugKotlin
          testDebugUnitTest
          assembleDebugAndroidTest

      - name: Commit phase one fixes
        run: |
          if git diff --quiet; then
            echo "Phase one fixes already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/local/TijarioDatabase.kt
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt
          git commit -m "fix(android): close migration and outbox blockers"
          git push origin HEAD:fix/full-audit-remediation
