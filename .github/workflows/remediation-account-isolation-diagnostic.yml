name: Remediation Account Isolation Diagnostic

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-account-isolation-diagnostic.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remediation-account-isolation-diagnostic.yml

permissions:
  contents: read

jobs:
  apply-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply and verify remediation
        id: remediation
        shell: bash
        run: |
          mkdir -p docs/ai
          : > docs/ai/ACCOUNT_ISOLATION_RUN.log
          set +e
          python3 scripts/remediation/account_isolation.py . >> docs/ai/ACCOUNT_ISOLATION_RUN.log 2>&1
          script_status=$?
          if [ "$script_status" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace compileDebugKotlin testDebugUnitTest assembleDebugAndroidTest >> docs/ai/ACCOUNT_ISOLATION_RUN.log 2>&1
            verify_status=$?
          else
            verify_status=$script_status
          fi
          set -e
          echo "remediation_status=$verify_status" >> docs/ai/ACCOUNT_ISOLATION_RUN.log
          echo "status=$verify_status" >> "$GITHUB_OUTPUT"

      - name: Package remediation output
        if: always()
        run: |
          mkdir -p /tmp/account-remediation/app/src/main/java/app/tijario/data/local
          mkdir -p /tmp/account-remediation/app/src/main/java/app/tijario/data/repository
          mkdir -p /tmp/account-remediation/app/schemas
          mkdir -p /tmp/account-remediation/docs/ai
          cp app/src/main/java/app/tijario/data/local/TijarioEntities.kt /tmp/account-remediation/app/src/main/java/app/tijario/data/local/
          cp app/src/main/java/app/tijario/data/local/TijarioDao.kt /tmp/account-remediation/app/src/main/java/app/tijario/data/local/
          cp app/src/main/java/app/tijario/data/local/TijarioDatabase.kt /tmp/account-remediation/app/src/main/java/app/tijario/data/local/
          cp app/src/main/java/app/tijario/data/repository/TijarioRepository.kt /tmp/account-remediation/app/src/main/java/app/tijario/data/repository/
          cp -R app/schemas/. /tmp/account-remediation/app/schemas/
          cp docs/ai/ACCOUNT_ISOLATION_RUN.log /tmp/account-remediation/docs/ai/

      - name: Upload remediation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-isolation-remediation
          path: /tmp/account-remediation
          if-no-files-found: error
          retention-days: 3

      - name: Fail workflow when verification failed
        if: steps.remediation.outputs.status != '0'
        run: exit 1
