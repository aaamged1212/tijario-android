name: Remediation Account Isolation Diagnostic

on:
  push:
    branches:
      - fix/full-audit-remediation
    paths:
      - .github/workflows/remediation-account-isolation-diagnostic.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remediation-account-isolation-diagnostic.yml

permissions:
  contents: write

jobs:
  apply-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-audit-remediation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Extract remediation program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/remediation-account-isolation.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          program_lines = []
          for line in workflow[start:end]:
              program_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/account_isolation_remediation.py').write_text('\n'.join(program_lines) + '\n', encoding='utf-8')
          PY

      - name: Apply, verify, and record result
        id: remediation
        shell: bash
        run: |
          mkdir -p docs/ai
          : > docs/ai/ACCOUNT_ISOLATION_RUN.log
          set +e
          python3 /tmp/account_isolation_remediation.py >> docs/ai/ACCOUNT_ISOLATION_RUN.log 2>&1
          script_status=$?
          if [ "$script_status" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace compileDebugKotlin testDebugUnitTest assembleDebugAndroidTest >> docs/ai/ACCOUNT_ISOLATION_RUN.log 2>&1
            verify_status=$?
          else
            verify_status=$script_status
          fi
          set -e
          echo "remediation_status=$verify_status" >> docs/ai/ACCOUNT_ISOLATION_RUN.log
          echo "status=$verify_status" >> "$GITHUB_OUTPUT"

      - name: Commit source and diagnostic log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/tijario/data/local/TijarioEntities.kt || true
          git add app/src/main/java/app/tijario/data/local/TijarioDao.kt || true
          git add app/src/main/java/app/tijario/data/local/TijarioDatabase.kt || true
          git add app/src/main/java/app/tijario/data/repository/TijarioRepository.kt || true
          git add app/schemas || true
          git add docs/ai/ACCOUNT_ISOLATION_RUN.log
          if git diff --cached --quiet; then
            echo "No account isolation changes to commit."
            exit 0
          fi
          git commit -m "fix(android): isolate local account data"
          git pull --rebase origin fix/full-audit-remediation
          git push origin HEAD:fix/full-audit-remediation

      - name: Fail workflow when verification failed
        if: steps.remediation.outputs.status != '0'
        run: exit 1
