name: Apply native password change

on:
  push:
    branches: [native-password-change]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-password-change
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node tools/patch-account-password-ui.mjs
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug lintRelease
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix(android): add verified in-app password change'
          branch: native-password-change
          file_pattern: 'app/src/main/java/app/tijario/ui/screens/SettingsScreens.kt'
